name: Release Gridy for Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the v prefix
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2025
    env:
      OPENCODE_CHANNEL: prod
      HUSKY: "0"
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --linker isolated --ignore-scripts
      - name: Prepare and build
        run: |
          $package = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_VERSION -ne $package.version) { throw "Version mismatch" }
          bun run --cwd packages/core fix-node-pty
          Copy-Item packages/ui/src/custom-elements.d.ts packages/app/src/custom-elements.d.ts -Force
          try {
            bun run --cwd packages/desktop typecheck
            if ($LASTEXITCODE) { throw "Typecheck failed" }
            bun run --cwd packages/desktop build
            if ($LASTEXITCODE) { throw "Build failed" }
          } finally { git restore packages/app/src/custom-elements.d.ts }
          bun run --cwd packages/desktop package:win
          if ($LASTEXITCODE) { throw "Packaging failed" }
          bun packages/desktop/scripts/verify-release.ts
          if ($LASTEXITCODE) { throw "Release verification failed" }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "packages/desktop/dist"
          $notes = Join-Path $env:RUNNER_TEMP "notes.md"
          "Gridy for Windows x64. Manual deployment; automatic updates are disabled. This build is unsigned. Verify the SHA256 checksum before installing." | Set-Content $notes
          gh release create "v$env:RELEASE_VERSION" "$dist/Gridy-win-x64.exe" "$dist/Gridy-win-x64.exe.blockmap" "$dist/Gridy-win-x64.exe.sha256.txt" --draft --title "Gridy $env:RELEASE_VERSION" --notes-file $notes
          if ($LASTEXITCODE) { throw "Draft release upload failed" }
